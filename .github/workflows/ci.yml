name: Frontend CI & CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality-and-build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: "https://analog-terrax-backend.vercel.app"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

  deploy-production:
    needs: [quality-and-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Vercel Production
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            npm install -g vercel@latest
            vercel pull --yes --environment=production
            vercel build --prod
            vercel deploy --prebuilt --prod --yes
          elif [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "Triggering Vercel production deployment via Deploy Hook..."
            curl -fsSL -X POST "$VERCEL_DEPLOY_HOOK_URL"
          else
            echo "::error::Neither VERCEL_TOKEN nor VERCEL_DEPLOY_HOOK_URL secret is configured."
            exit 1
          fi
